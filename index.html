<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BoWo Legal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: #f3f3f3;
    }
    .wrap {
      max-width: 860px;
      margin: 40px auto;
      padding: 24px;
    }
    .card {
      background: #1d1d22;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    h1 {
      margin-top: 0;
      color: #0aa5ff;
    }
    p {
      line-height: 1.7;
      color: #dddddd;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }
    a {
      display: inline-block;
      text-decoration: none;
      font-weight: bold;
      color: #111;
      background: #ffd600;
      padding: 12px 18px;
      border-radius: 12px;
    }
    a.secondary {
      background: #0aa5ff;
      color: white;
    }
    a.danger {
      background: #ff355e;
      color: white;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>BoWo — Legal Pages</h1>
      <p>Official legal pages for BoWo.</p>
      <p>
        This site contains the public legal documents associated with the BoWo app.
      </p>

      <div class="links">
        <a href="./privacy-policy.html">Privacy Policy</a>
        <a class="secondary" href="./terms.html">Terms of Use</a>
        <a class="danger" href="./account-deletion.html">Account Deletion</a>
      </div>
    </div>
  </div>
</body>
</html>
